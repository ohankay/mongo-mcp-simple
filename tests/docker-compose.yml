# Test servers: docker compose -f tests/docker-compose.yml up -d
# then initiate the replica set once:
#   docker exec mongo-rs mongosh --port 27019 --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27019'}]})"
services:
  mongo8:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "Str0ng!Pass"
    ports: ["27018:27017"]
  mongo44:
    image: mongo:4.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "Str0ng!Pass"
    ports: ["27044:27017"]
  mongo-rs:
    image: mongo:8.0
    container_name: mongo-rs
    command: ["--replSet", "rs0", "--port", "27019", "--bind_ip_all"]
    ports: ["27019:27019"]
